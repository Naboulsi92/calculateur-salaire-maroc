      .lien {
        font-family: var(--mono); font-size: 13px; text-decoration: none; min-height: 44px;
        display: inline-flex; align-items: center; padding: 10px 16px; border-radius: 999px;
        border: 1.5px solid var(--ink); background: #fff; color: var(--ink);
      }
      .lien.primaire { background: var(--emerald); border-color: var(--emerald); color: #fff; }
      .lien:hover { border-color: var(--emerald); }
      .lien.primaire:hover { background: var(--emerald-deep); }
      .code404 { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); margin: 18px 0 0; opacity: 0.7; }
